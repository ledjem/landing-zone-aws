name: 'Analyse de sécurité Terraform'
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  terraform-security-scan:
    name: 'Scan de Sécurité Terraform'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout du code'
        uses: actions/checkout@v4

      - name: 'Analyse de sécurité avec TFSec'
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .
          soft_fail: true

      - name: 'Analyse de sécurité avec Checkov'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          soft_fail: true
